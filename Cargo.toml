[package]
name = "webdesk"
# Release numbers are YY.MM.Build and are assigned by CI, which knows how many
# releases this month already exist. This value is only the floor a local or
# from-source build reports when no CI number was stamped in -- see build.rs.
version = "26.8.1"
edition = "2021"
build = "build.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
# No HTTP client, deliberately, and this is the one dependency note worth
# reading. `hyper`, `hyper-util` and `http-body-util` were here for a reverse
# proxy that put a container app on this origin; that is gone, and nothing
# replaced it. A link is fetched by the browser, never by this process -- see
# src/links.rs for why a server-side fetch would be a request-forgery primitive
# handed to every signed-in session. Anything that adds an HTTP client back is
# reintroducing that, whatever it is called.
#
# TLS for WebDesk's own listener, which is how it serves by default -- see
# tls.rs. rustls rather than native-tls on purpose: native-tls wants OpenSSL
# headers at build time, and this program builds on a stock host with nothing
# beyond gcc. `ring` rather than aws-lc-rs for the same reason -- that backend
# needs cmake. rcgen mints the self-signed certificate a fresh host uses until
# it is given a real one, and is a real dependency rather than a dev one because
# a login form that waits for somebody to go and run openssl is a login form
# that gets served over http.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "process", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
libc = "0.2"
futures-util = "=0.3.31"
rand = "0.8"
nix = { version = "0.29", features = ["user", "process", "fs", "term", "socket", "poll", "signal", "hostname"] }
portable-pty = "0.8"
users = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
